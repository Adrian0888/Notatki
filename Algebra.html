<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompendium Algebry Macierzy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- MathJax for rendering LaTeX formulas -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f4; /* Stone-100 - Warm Neutral */
            color: #1c1917; /* Stone-900 */
        }
        
        /* Chart Container Styling - MANDATORY */
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            height: 300px;
            max-height: 400px;
        }
        @media (min-width: 768px) {
            .chart-container {
                height: 350px;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e7e5e4; 
        }
        ::-webkit-scrollbar-thumb {
            background: #a8a29e; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #78716c; 
        }

        .tab-active {
            border-bottom: 3px solid #0ea5e9; /* Sky-500 */
            color: #0c4a6e; /* Sky-900 */
            background-color: #f0f9ff;
        }
        .tab-inactive {
            border-bottom: 3px solid transparent;
            color: #57534e; /* Stone-600 */
        }
        .tab-inactive:hover {
            color: #1c1917;
            background-color: #e7e5e4;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* MathJax adjustments to avoid layout shifts */
        .mjx-chtml {
            font-size: 110% !important;
        }
    </style>
    <!-- Chosen Palette: Warm Stone Neutrals with Sky Blue Accents. 
         Backgrounds: Stone-50/100. Text: Stone-800/900. Accents: Sky-500/600. -->
    
    <!-- Application Structure Plan: 
         Updated index.html with MathJax integration to render LaTeX formulas ($...$). 
         The structure remains tab-based for Stage-by-Stage learning.
         Added MathJax script in head and configuration to ensure $ triggers inline math rendering.
    -->

    <!-- Visualization & Content Choices:
         1. Logic: Use MathJax library to convert LaTeX strings into beautifully rendered math.
         2. Content: The core educational content is preserved but with fixed visual rendering.
    -->

    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-2xl font-bold text-stone-800 tracking-tight">Algebra<span class="text-sky-600">Hub</span></span>
                </div>
                <!-- Desktop Nav -->
                <div class="hidden md:flex space-x-1 h-full items-end" id="desktop-nav">
                    <!-- Nav items injected by JS -->
                </div>
                <!-- Mobile Menu Button -->
                <div class="flex items-center md:hidden">
                    <button id="mobile-menu-btn" class="text-stone-600 hover:text-stone-900 focus:outline-none text-2xl">
                        &#9776;
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile Nav -->
        <div id="mobile-menu" class="hidden md:hidden bg-stone-50 border-t border-stone-200">
            <!-- Mobile items injected by JS -->
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div id="content-area" class="fade-in">
            <!-- Dynamic Content Loaded Here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-stone-100 border-t border-stone-200 mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8 text-center text-stone-500 text-sm">
            <p>&copy; 2025 Kompendium Algebry Liniowej. Poprawiono wyświetlanie wzorów matematycznych.</p>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // --- Data & State ---
        const appState = {
            currentTab: 'dashboard',
            matrixData: {
                a_rows: 2,
                a_cols: 3,
                b_rows: 3,
                b_cols: 2
            }
        };

        const tabs = [
            { id: 'dashboard', label: 'Przegląd' },
            { id: 'stage1', label: '1. Operacje' },
            { id: 'stage2', label: '2. Wyznaczniki' },
            { id: 'stage3', label: '3. Ax = b' },
            { id: 'stage4', label: '4. Metody' }
        ];

        // --- Render Functions ---

        function renderNav() {
            const desktopNav = document.getElementById('desktop-nav');
            const mobileMenu = document.getElementById('mobile-menu');
            
            let desktopHTML = '';
            let mobileHTML = '';

            tabs.forEach(tab => {
                const isActive = appState.currentTab === tab.id;
                const desktopClass = isActive ? 'tab-active' : 'tab-inactive';
                const mobileClass = isActive ? 'bg-sky-50 text-sky-700' : 'text-stone-600 hover:bg-stone-100';

                desktopHTML += `<button onclick="switchTab('${tab.id}')" class="${desktopClass} px-4 py-4 text-sm font-medium transition-colors duration-200 focus:outline-none">${tab.label}</button>`;
                mobileHTML += `<button onclick="switchTab('${tab.id}')" class="${mobileClass} block w-full text-left px-4 py-3 text-base font-medium border-l-4 ${isActive ? 'border-sky-500' : 'border-transparent'}">${tab.label}</button>`;
            });

            desktopNav.innerHTML = desktopHTML;
            mobileMenu.innerHTML = mobileHTML;
        }

        function switchTab(tabId) {
            appState.currentTab = tabId;
            renderNav();
            renderContent();
            document.getElementById('mobile-menu').classList.add('hidden');
        }

        function renderContent() {
            const container = document.getElementById('content-area');
            container.classList.remove('fade-in');
            void container.offsetWidth; 
            container.classList.add('fade-in');

            switch (appState.currentTab) {
                case 'dashboard': renderDashboard(container); break;
                case 'stage1': renderStage1(container); break;
                case 'stage2': renderStage2(container); break;
                case 'stage3': renderStage3(container); break;
                case 'stage4': renderStage4(container); break;
            }

            // Trigger MathJax re-render
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise();
            }
        }

        function renderDashboard(container) {
            container.innerHTML = `
                <div class="text-center mb-12">
                    <h1 class="text-4xl font-bold text-stone-800 mb-4">Witaj w Kompendium Algebry</h1>
                    <p class="text-lg text-stone-600 max-w-2xl mx-auto">
                        Twoja interaktywna mapa przez świat macierzy. Wzory są teraz poprawnie renderowane.
                    </p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    ${createDashboardCard('1. Fundamenty', 'Operacje na macierzach, dodawanie, mnożenie.', 'stage1', 'bg-stone-200')}
                    ${createDashboardCard('2. Wartości', 'Wyznaczniki i macierze odwrotne.', 'stage2', 'bg-stone-300')}
                    ${createDashboardCard('3. Język Macierzy', 'Zapis $A \\cdot x = b$ i wektory.', 'stage3', 'bg-stone-400 text-white')}
                    ${createDashboardCard('4. Rozwiązywanie', 'Cramer i Eliminacja Gaussa.', 'stage4', 'bg-stone-800 text-white')}
                </div>

                <div class="mt-12 bg-white rounded-xl shadow-sm p-8 border border-stone-200">
                    <h2 class="text-2xl font-bold text-stone-800 mb-4">Poprawione wyświetlanie</h2>
                    <p class="text-stone-600 mb-4">
                        Wyeliminowaliśmy surowy kod matematyczny. Teraz wszystkie zapisy, takie jak $c_{ij}$ czy $\\det A$, są wyświetlane w czytelnej formie.
                    </p>
                    <div class="flex items-center space-x-2 text-sky-600 font-semibold cursor-pointer" onclick="switchTab('stage1')">
                        <span>Rozpocznij naukę</span>
                        <span>&#8594;</span>
                    </div>
                </div>
            `;
        }

        function createDashboardCard(title, desc, tabId, bgColorClass) {
            return `
                <div onclick="switchTab('${tabId}')" class="group cursor-pointer rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-shadow duration-300 bg-white border border-stone-200 flex flex-col h-full">
                    <div class="h-2 ${bgColorClass}"></div>
                    <div class="p-6 flex-grow">
                        <h3 class="text-xl font-bold text-stone-800 mb-2 group-hover:text-sky-600 transition-colors">${title}</h3>
                        <p class="text-stone-600 text-sm">${desc}</p>
                    </div>
                    <div class="px-6 py-3 bg-stone-50 border-t border-stone-100 flex justify-between items-center text-stone-400">
                        <span class="text-xs font-semibold uppercase tracking-wide">Przejdź</span>
                        <span>&#8594;</span>
                    </div>
                </div>
            `;
        }

        function renderStage1(container) {
            container.innerHTML = `
                <div class="mb-8">
                    <h2 class="text-3xl font-bold text-stone-800 mb-2">Etap 1: Fundamenty</h2>
                    <p class="text-stone-600">Podstawowe operacje algebraiczne.</p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
                            <h3 class="text-xl font-bold text-stone-800 mb-3 border-b pb-2">Dodawanie i Odejmowanie</h3>
                            <p class="text-stone-600 mb-3">Wzór: $C_{ij} = A_{ij} \\pm B_{ij}$</p>
                        </div>
                        
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
                            <h3 class="text-xl font-bold text-stone-800 mb-3 border-b pb-2">Mnożenie Macierzy</h3>
                            <p class="text-stone-600 mb-3 text-sm italic">Zasada: "Wiersz razy Kolumna"</p>
                            <ul class="list-disc list-inside text-stone-600 space-y-2 text-sm">
                                <li>Liczba kolumn A musi być równa liczbie wierszy B.</li>
                                <li>Element $c_{ij}$ to suma iloczynów $i$-tego wiersza A i $j$-tej kolumny B.</li>
                                <li class="text-red-500 font-semibold">Brak przemienności: $A \\cdot B \\neq B \\cdot A$.</li>
                            </ul>
                        </div>
                    </div>

                    <div class="bg-stone-800 text-white p-6 rounded-xl shadow-lg">
                        <h3 class="text-xl font-bold mb-4 text-sky-400">Symulator Wymiarów</h3>
                        <div class="flex items-center justify-center space-x-2 mb-6">
                            <div class="text-center">
                                <label class="block text-xs text-stone-400 mb-1">A</label>
                                <div class="flex items-center bg-stone-700 rounded p-2">
                                    <input type="number" id="a-rows" value="2" class="w-10 bg-transparent text-center text-white focus:outline-none font-bold" min="1">
                                    <span class="mx-1 text-stone-500">x</span>
                                    <input type="number" id="a-cols" value="3" class="w-10 bg-transparent text-center text-white focus:outline-none font-bold" min="1">
                                </div>
                            </div>
                            <span class="text-2xl text-stone-500">&times;</span>
                            <div class="text-center">
                                <label class="block text-xs text-stone-400 mb-1">B</label>
                                <div class="flex items-center bg-stone-700 rounded p-2">
                                    <input type="number" id="b-rows" value="3" class="w-10 bg-transparent text-center text-white focus:outline-none font-bold" min="1">
                                    <span class="mx-1 text-stone-500">x</span>
                                    <input type="number" id="b-cols" value="2" class="w-10 bg-transparent text-center text-white focus:outline-none font-bold" min="1">
                                </div>
                            </div>
                        </div>
                        <div id="mult-result" class="text-center p-4 rounded bg-stone-700/50 border border-stone-600 min-h-[80px] flex items-center justify-center"></div>
                        <button onclick="checkDimensions()" class="w-full mt-6 bg-sky-600 hover:bg-sky-500 text-white font-bold py-2 px-4 rounded transition-colors">Sprawdź wymiary</button>
                    </div>
                </div>
            `;
            checkDimensions();
        }

        function renderStage2(container) {
            container.innerHTML = `
                <div class="mb-8">
                    <h2 class="text-3xl font-bold text-stone-800 mb-2">Etap 2: Wyznaczniki i Macierze Odwrotne</h2>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
                            <h3 class="text-xl font-bold text-stone-800 mb-4">Obliczanie Wyznacznika</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="p-4 bg-stone-50 rounded-lg">
                                    <h4 class="font-bold text-sky-700 mb-2">Dla 2x2</h4>
                                    <p class="font-mono text-lg">$\\det A = ad - bc$</p>
                                </div>
                                <div class="p-4 bg-stone-50 rounded-lg">
                                    <h4 class="font-bold text-sky-700 mb-2">Dla 3x3</h4>
                                    <p class="text-sm">Metoda Sarrusa lub Laplace'a.</p>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
                            <h3 class="text-xl font-bold text-stone-800 mb-3">Macierz Odwrotna ($A^{-1}$)</h3>
                            <p class="text-stone-600 mb-4">Definicja: $A \\cdot A^{-1} = I$</p>
                            <div class="p-4 bg-amber-50 border-l-4 border-amber-400 text-amber-900 text-sm">
                                <strong>Warunek:</strong> $\\det A \\neq 0$ (Macierz musi być nieosobliwa).
                            </div>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
                            <h3 class="text-lg font-bold text-stone-800 mb-4">Tester Wyznacznika 2x2</h3>
                            <div class="grid grid-cols-2 gap-2 mb-4 max-w-[150px] mx-auto font-mono text-center">
                                <input type="number" id="d2-a" value="5" class="p-2 border rounded">
                                <input type="number" id="d2-b" value="2" class="p-2 border rounded">
                                <input type="number" id="d2-c" value="3" class="p-2 border rounded">
                                <input type="number" id="d2-d" value="4" class="p-2 border rounded">
                            </div>
                            <div class="text-center">
                                <button onclick="calcDet2()" class="bg-stone-800 text-white px-4 py-2 rounded text-sm mb-3">Oblicz $\\det$</button>
                                <div id="det2-result" class="text-lg font-bold text-sky-600">Wynik: 14</div>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-200">
                            <h3 class="text-lg font-bold text-stone-800 mb-4">Złożoność Obliczeń</h3>
                            <div class="chart-container">
                                <canvas id="detChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            setTimeout(initDetChart, 100);
        }

        function renderStage3(container) {
            container.innerHTML = `
                <div class="mb-8">
                    <h2 class="text-3xl font-bold text-stone-800 mb-2">Etap 3: Język Macierzy</h2>
                    <p class="text-stone-600">Formuła podstawowa: $A \\cdot x = b$</p>
                </div>

                <div class="bg-white p-8 rounded-xl shadow-sm border border-stone-200 mb-8 overflow-x-auto">
                    <div class="flex flex-col md:flex-row items-center justify-center space-y-4 md:space-y-0 md:space-x-8 text-3xl font-mono font-bold">
                        <div class="text-center">
                            <div class="p-6 bg-sky-100 text-sky-800 rounded-lg">A</div>
                            <p class="text-xs font-sans font-normal text-stone-500 mt-2">Współczynniki</p>
                        </div>
                        <div class="text-stone-400">&sdot;</div>
                        <div class="text-center">
                            <div class="p-6 bg-purple-100 text-purple-800 rounded-lg">x</div>
                            <p class="text-xs font-sans font-normal text-stone-500 mt-2">Niewiadome</p>
                        </div>
                        <div class="text-stone-400">=</div>
                        <div class="text-center">
                            <div class="p-6 bg-emerald-100 text-emerald-800 rounded-lg">b</div>
                            <p class="text-xs font-sans font-normal text-stone-500 mt-2">Wyr. wolne</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="bg-stone-50 p-6 rounded-xl border border-stone-200">
                        <h3 class="text-xl font-bold text-stone-800 mb-3">Zalety Zapisu</h3>
                        <p class="text-stone-600">Traktujemy dziesiątki równań jako jeden obiekt matematyczny. Możemy obliczyć $x = A^{-1} \\cdot b$.</p>
                    </div>
                    <div class="bg-stone-50 p-6 rounded-xl border border-stone-200">
                        <h3 class="text-xl font-bold text-stone-800 mb-3">Przykład</h3>
                        <div class="text-xs font-mono space-y-4">
                            <div class="p-2 bg-white rounded border">
                                $2x + 3y = 5$<br>$4x - 1y = 2$
                            </div>
                            <div class="text-center text-stone-400">&darr;</div>
                            <div class="p-2 bg-white rounded border">
                                $\\begin{pmatrix} 2 & 3 \\\\ 4 & -1 \\end{pmatrix} \\cdot \\begin{pmatrix} x \\\\ y \\end{pmatrix} = \\begin{pmatrix} 5 \\\\ 2 \\end{pmatrix}$
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStage4(container) {
            container.innerHTML = `
                <div class="mb-8">
                    <h2 class="text-3xl font-bold text-stone-800 mb-2">Etap 4: Rozwiązywanie Układów</h2>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-1 space-y-6 text-sm">
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200">
                            <h3 class="font-bold text-purple-700">Metoda Cramera</h3>
                            <p class="text-stone-600">$x_i = W_i / W$. Tylko gdy $W \\neq 0$.</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200">
                            <h3 class="font-bold text-emerald-700">Macierz Odwrotna</h3>
                            <p class="text-stone-600">$x = A^{-1} \\cdot b$.</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200">
                            <h3 class="font-bold text-sky-700">Eliminacja Gaussa</h3>
                            <p class="text-stone-600">Operacje na wierszach macierzy $[A | b]$.</p>
                        </div>
                    </div>

                    <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-stone-200">
                        <h3 class="text-xl font-bold text-stone-800 mb-4">Metody: Porównanie</h3>
                        <div class="chart-container">
                            <canvas id="methodsChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="mt-8 bg-stone-800 text-stone-200 p-6 rounded-xl">
                    <h3 class="text-lg font-bold text-white mb-4">Twierdzenie Kroneckera-Capellego</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-mono">
                        <div class="p-4 bg-stone-700 rounded border border-red-500/30">
                            <span class="text-red-400">[0 0 0 | 7]</span> &rarr; Brak rozwiązań.
                        </div>
                        <div class="p-4 bg-stone-700 rounded border border-sky-500/30">
                            <span class="text-sky-400">[0 0 0 | 0]</span> &rarr; Nieskończenie wiele rozwiązań.
                        </div>
                    </div>
                </div>
            `;
            setTimeout(initMethodsChart, 100);
        }

        // --- Logic: Calculations ---

        function checkDimensions() {
            const ar = parseInt(document.getElementById('a-rows').value);
            const ac = parseInt(document.getElementById('a-cols').value);
            const br = parseInt(document.getElementById('b-rows').value);
            const bc = parseInt(document.getElementById('b-cols').value);
            const resultDiv = document.getElementById('mult-result');
            if (ac === br) {
                resultDiv.innerHTML = `<div class="text-emerald-400 font-bold">Możliwe! Wynik: ${ar} x ${bc}</div>`;
            } else {
                resultDiv.innerHTML = `<div class="text-red-400 font-bold">Błąd: ${ac} &ne; ${br}</div>`;
            }
        }

        function calcDet2() {
            const a = parseFloat(document.getElementById('d2-a').value);
            const b = parseFloat(document.getElementById('d2-b').value);
            const c = parseFloat(document.getElementById('d2-c').value);
            const d = parseFloat(document.getElementById('d2-d').value);
            document.getElementById('det2-result').innerText = `Wynik: ${(a * d) - (b * c)}`;
        }

        // --- Charts ---

        function initDetChart() {
            const ctx = document.getElementById('detChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['2x2', '3x3', '4x4', '5x5'],
                    datasets: [{
                        label: 'Operacje',
                        data: [3, 17, 100, 500],
                        backgroundColor: '#bae6fd'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function initMethodsChart() {
            const ctx = document.getElementById('methodsChart').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Szybkość', 'Uniwersalność', 'Stabilność', 'Łatwość'],
                    datasets: [
                        { label: 'Gauss', data: [9, 10, 9, 5], borderColor: '#0ea5e9' },
                        { label: 'Cramer', data: [5, 2, 4, 9], borderColor: '#9333ea' }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // --- Navigation ---
        document.addEventListener('DOMContentLoaded', () => {
            renderNav();
            renderContent();
            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                document.getElementById('mobile-menu').classList.toggle('hidden');
            });
        });

    </script>
</body>
</html>
